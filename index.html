<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارتش سایه‌ها | وبلاگ تحلیلی سینما</title>
    <style>
        body {
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 40px;
        }
        h1 {
            color: #ff4757;
            font-size: 2.2rem;
            margin: 0;
        }
        p.subtitle {
            color: #888;
            font-size: 1rem;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        .card h2 {
            color: #ffa502;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .article-text {
            white-space: pre-line;
            font-size: 1.05rem;
            color: #ccc;
            text-align: justify;
        }
        .youtube-btn {
            display: inline-block;
            background-color: #ff0000;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
        }
        .youtube-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 ارتش سایه‌ها</h1>
        <p class="subtitle">نقد، تحلیل و دکوپاژ آثار برتر سینما و انیمیشن</p>
    </header>

    <div id="articles">
        <p style="text-align: center; color: #888;">در حال دریافت مقالات...</p>
    </div>
</div>

<script>
    fetch('data.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('articles');
            container.innerHTML = '';

            data.forEach(item => {
                // تنها مواردی که مقاله متنی کامل دارند را روی سایت نمایش می‌دهد
                if (item.full_review && item.full_review.trim() !== '') {
                    const card = document.createElement('div');
                    card.className = 'card';

                    let youtubeHtml = '';
                    if (item.video_link) {
                        youtubeHtml = `<a href="${item.video_link}" target="_blank" class="youtube-btn">▶️ تماشای تحلیل ویدیویی در یوتیوب</a>`;
                    }

                    card.innerHTML = `
                        <h2>${item.title}</h2>
                        <div class="article-text">${item.full_review}</div>
                        ${youtubeHtml}
                    `;

                    container.appendChild(card);
                }
            });
        })
        .catch(err => {
            document.getElementById('articles').innerHTML = '<p style="text-align: center; color: red;">خطا در دریافت مقالات!</p>';
        });
</script>

</body>
</html>
